[package]
name = "aion-classic-emu"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aion-classic-emu"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
parking_lot = "0.12"
warp = "0.4"
flate2 = { version = "1.0", features = ["rust_backend"] }
mysql = { version = "28", default-features = false }
wry = "0.47"
tao = "0.31"
windows-sys = { version = "0.52", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi"
] }

[build-dependencies]
winres = "0.1"
