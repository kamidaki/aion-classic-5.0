################################################################################
##                                                                            ##
##  [1] CONFIGURAÇÕES DE REDE E CANAIS DE CHAT (NETWORK & CHANNELS)           ##
##                                                                            ##
################################################################################

# Endereço IP de escuta do Chat-Server.
# Use 127.0.0.1 para conexões locais ou 0.0.0.0 para acesso público externo.
# Padrão: 127.0.0.1
chatserver.network.bind.address = 127.0.0.1

# Porta TCP pública onde o cliente do jogo se conecta para canais de conversa (geral, whisper, shout, legião).
# Padrão oficial: 10241
chatserver.network.port = 10241

# Porta TCP interna privada para comunicação e sincronização de canais com o Game-Server.
# Padrão: 9021
chatserver.network.internal.port = 9021

# Senha interna de autenticação correspondente à configurada no Game-Server.
# Padrão: Sabrewolf100!
chatserver.network.password = Sabrewolf100!

# Quantidade máxima de canais de chat dinâmicos simultâneos permitidos.
# Padrão: 500
chatserver.max.channels = 500

# Número máximo de mensagens por segundo permitidas por jogador antes do anti-flood silenciar o canal.
# Padrão: 5
chatserver.anti.flood.messages.per.sec = 5


################################################################################
##                                                                            ##
##  [2] BANCO DE DADOS (DATABASE CONFIGURATION)                               ##
##                                                                            ##
################################################################################

# Caminho relativo para o arquivo de banco de dados SQLite onde são salvos os canais e histórico de moderação.
# Padrão: data/Banco de Dados/chat.db
chatserver.database.path = data/Banco de Dados/chat.db
