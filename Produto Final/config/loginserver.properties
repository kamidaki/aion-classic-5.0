##                                                                            ##
##            AION CLASSIC EMULATOR — LOGIN-SERVER CONFIGURATION             ##
##                                                                            ##
################################################################################

################################################################################
##                                                                            ##
##  [1] CONFIGURAÇÕES DE REDE E PORTAS (NETWORK & PORTS)                      ##
##                                                                            ##
################################################################################

# Endereço IP de escuta do Login-Server.
# Use 127.0.0.1 para testes locais ou 0.0.0.0 para acesso público externo.
# Padrão: 127.0.0.1
loginserver.network.bind.address = 127.0.0.1

# Porta TCP oficial de autenticação e handshake onde o cliente Aion se conecta inicialmente.
# Padrão oficial: 2106
loginserver.network.client.port = 2106

# Porta TCP para o protocolo de autenticação secundária HQ Gameforge (C_HQ_LOGIN / S_HQ_LOGIN).
# Padrão: 13001
loginserver.network.hq.port = 13001

# Porta TCP para o Session Token Service (STS) do cliente Aion.
# Padrão: 6600
loginserver.network.sts.port = 6600

# Porta TCP interna privada para comunicação e registro de instâncias de Game-Server.
# Padrão: 9014
loginserver.network.gameserver.port = 9014

# Senha interna obrigatória que o Game-Server deve enviar para se autorizar perante este Login-Server.
# Padrão: Sabrewolf100!
loginserver.network.gameserver.password = Sabrewolf100!

# Endereço IP do Game-Server entregue ao cliente na lista de servidores (SM_SERVER_LIST).
# Padrão: 127.0.0.1
loginserver.network.announce.gameserver.ip = 127.0.0.1

# Porta do Game-Server entregue ao cliente na lista de servidores.
# Padrão: 7777
loginserver.network.announce.gameserver.port = 7777

# ID único padrão do mundo de jogo anunciado na lista de servidores.
# Padrão: 1
loginserver.network.default.server.id = 1

# Se verdadeiro, cria automaticamente uma nova conta no banco de dados SQLite no primeiro login do jogador.
# Padrão: true
loginserver.auto.create.accounts = true


################################################################################
##                                                                            ##
##  [2] BANCO DE DADOS (DATABASE CONFIGURATION)                               ##
##                                                                            ##
################################################################################

# Caminho relativo para o arquivo de banco de dados SQLite onde são armazenadas as contas e sessões de login.
# Padrão: data/Banco de Dados/login.db
loginserver.database.path = data/Banco de Dados/login.db


################################################################################
##                                                                            ##
##  [3] SEGURANÇA E PROTEÇÃO CONTRA FORÇA BRUTA (SECURITY & RATE LIMITING)    ##
##                                                                            ##
################################################################################

# Ativa o sistema de proteção de rate limiting contra tentativas repetidas de ataque de força bruta no login.
# Padrão: true
loginserver.security.rate.limit.enable = true

# Número máximo de tentativas de autenticação permitidas por minuto antes de bloquear temporariamente o IP.
# Padrão: 15
loginserver.security.max.attempts.per.minute = 15

# Tempo em minutos que o endereço IP do atacante permanecerá bloqueado após exceder o limite.
# Padrão: 10
loginserver.security.temp.ban.minutes = 10
