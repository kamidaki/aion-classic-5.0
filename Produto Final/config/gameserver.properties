##                                                                            ##
##             AION CLASSIC EMULATOR — GAME-SERVER CONFIGURATION             ##
##                                                                            ##
################################################################################

################################################################################
##                                                                            ##
##  [1] CONFIGURAÇÕES DE REDE E SERVIDOR (NETWORK & SERVER)                   ##
##                                                                            ##
################################################################################

# Endereço IP de escuta do Game-Server.
# Use 127.0.0.1 para conexões locais ou 0.0.0.0 para aceitar conexões externas de toda a rede/internet.
# Padrão: 127.0.0.1
gameserver.network.bind.address = 127.0.0.1

# Porta TCP principal onde o cliente do jogo se conecta para o mundo, combate, inventário e movimento.
# Padrão oficial do Aion Classic: 7777
gameserver.network.port = 7777

# Identificador único deste Game-Server perante o Login-Server e Chat-Server.
# Deve corresponder ao ID cadastrado na tabela de servidores do Login-Server.
# Padrão: 1
gameserver.server.id = 1

# Nome do servidor exibido na tela de seleção de mundos dentro do cliente Aion.
# Padrão: Brasil em Chamas (São Paulo)
gameserver.server.name = Brasil em Chamas (São Paulo)

# Capacidade máxima de jogadores conectados simultaneamente neste servidor de jogo.
# Padrão: 100
gameserver.server.max.players = 100

# Número de threads dedicadas para o processamento assíncrono de I/O de rede (NIO).
# Padrão: 2
gameserver.network.nio.threads = 2

# Quantidade mínima de threads no pool de processamento de pacotes recebidos do cliente.
# Padrão: 2
gameserver.network.processor.threads.min = 2

# Quantidade máxima de threads no pool de processamento de pacotes.
# Padrão: 8
gameserver.network.processor.threads.max = 8

# Limite de tempo ocioso para desalocar worker threads excedentes.
# Padrão: 3
gameserver.network.processor.threshold.kill = 3

# Quantidade de pacotes acumulados na fila para disparar a criação de uma nova worker thread.
# Padrão: 50
gameserver.network.processor.threshold.spawn = 50

# Se verdadeiro, exibe avisos detalhados no console sobre pacotes/opcodes recebidos e ainda não mapeados.
# Padrão: true
gameserver.network.display.unknown.packets = true

# Se verdadeiro, exibe dump hexadecimal e conteúdo dos pacotes trafegados na sessão.
# Padrão: true
gameserver.network.display.packets = true


################################################################################
##                                                                            ##
##  [2] CONEXÕES INTER-SERVIDORES (LOGIN-SERVER & CHAT-SERVER)                ##
##                                                                            ##
################################################################################

# Endereço IP e porta TCP interna para comunicação e autenticação com o Login-Server.
# Padrão: 127.0.0.1:9014
gameserver.login.address = 127.0.0.1:9014

# Senha interna compartilhada para autorizar o registro deste Game-Server no Login-Server.
# Padrão: Sabrewolf100!
gameserver.login.password = Sabrewolf100!

# Endereço IP e porta TCP interna para comunicação e sincronização com o Chat-Server.
# Padrão: 127.0.0.1:9021
gameserver.chat.address = 127.0.0.1:9021

# Senha interna compartilhada para autorizar a conexão deste Game-Server no Chat-Server.
# Padrão: Sabrewolf100!
gameserver.chat.password = Sabrewolf100!

# Habilita ou desabilita a integração de canais de texto e chat global com o Chat-Server.
# Padrão: true
gameserver.chat.enable = true


################################################################################
##                                                                            ##
##  [3] BANCO DE DADOS & ARQUIVOS DE DADOS (DATABASE & CLIENT DATA)           ##
##                                                                            ##
################################################################################

# Caminho relativo para o arquivo de banco de dados SQLite onde são salvos os personagens, itens, inventário, skills e quests.
# Padrão: data/Banco de Dados/game.db
gameserver.database.path = data/Banco de Dados/game.db

# Diretório base contendo os arquivos XML e templates extraídos dos dados do cliente (templates de itens, npcs, skills, etc.).
# Padrão: data/client
gameserver.data.dir = data/client

# Caminho para o arquivo XML contendo os pontos de spawn e coordenadas dos monstros e NPCs.
# Padrão: data/client/spawns.xml
gameserver.spawns.file = data/client/spawns.xml

# Caminho para o arquivo XML contendo os itens iniciais entregues na criação de novos personagens.
# Padrão: data/client/initial_kit.xml
gameserver.initial.kit.file = data/client/initial_kit.xml


################################################################################
##                                                                            ##
##  [4] JOGABILIDADE, NÍVEIS E REGRAS DO MUNDO (GAMEPLAY & RULES)             ##
##                                                                            ##
################################################################################

# Código de país da região do cliente do jogo:
# 0: Coreia (KR), 1: América do Norte (NA), 2: Europa (EU Classic), 7: Rússia (RUS)
# Padrão: 2
gameserver.country.code = 2

# Exibe a revisão/versão do emulador na mensagem do dia (MOTD) enviada ao jogador no momento do login.
# Padrão: false
gameserver.display.revision = false

# Limite máximo de personagens permitidos por conta de jogador neste servidor (máximo suportado: 8).
# Padrão: 8
gameserver.character.limit.count = 8

# Modo de criação de facção por conta:
# 0: O jogador só pode criar personagens da mesma facção (Elyos ou Asmodian).
# 1: O jogador pode criar personagens de ambas as facções na mesma conta.
# 2: Modo reserva de personagem (vinculado a uma facção com limite de 2 personagens).
# Padrão: 1
gameserver.character.creation.mode = 1

# Nível máximo (Level Cap) que um jogador pode atingir no servidor.
# Padrão Aion Classic: 55
gameserver.players.max.level = 55

# Nível inicial com o qual novos personagens nascem no mundo.
# Padrão: 1
gameserver.starting.level = 1

# Nível máximo atingível pela classe básica antes da conclusão da quest de ascensão a Daeva.
# Padrão: 10
gameserver.startClass.maxLevel = 10

# Expressão regular (Regex) para validação de caracteres e comprimento permitidos no nome do personagem.
# Padrão: ^[a-zA-Z0-9]{2,16}$
gameserver.character.name.pattern = ^[a-zA-Z0-9]{2,16}$

# Tempo de espera (cooldown em segundos) obrigatório para deslogar ou trocar de personagem no jogo.
# Padrão: 20
gameserver.character.reentry.time.secs = 20


################################################################################
##                                                                            ##
##  [5] TAXAS DO SERVIDOR E MULTIPLICADORES (RATES & MULTIPLIERS)             ##
##                                                                            ##
################################################################################

# Multiplicador de experiência (XP) ao matar monstros e criaturas normais no mundo.
# Padrão: 1.0 (1x)
gameserver.rate.xp = 1.0

# Multiplicador de experiência (XP) ao concluir missões e quests.
# Padrão: 1.0 (1x)
gameserver.rate.quest.xp = 1.0

# Multiplicador de taxa de drop de itens obtidos de monstros.
# Padrão: 1.0 (1x)
gameserver.rate.drop = 1.0

# Multiplicador da quantidade de Kinah (moeda do jogo) dropada pelos monstros.
# Padrão: 1.0 (1x)
gameserver.rate.kinah = 1.0

# Multiplicador de Abyss Points (AP) ganhos ao derrotar jogadores inimigos em combate PvP.
# Padrão: 1.0 (1x)
gameserver.rate.ap.player = 1.0

# Multiplicador de Abyss Points (AP) ganhos ao abater NPCs no Abyss e instâncias PvPvE.
# Padrão: 1.0 (1x)
gameserver.rate.ap.npc = 1.0

# Multiplicador de experiência adquirida no avanço de profissões de Crafting (manufatura).
# Padrão: 1.0 (1x)
gameserver.rate.craft.xp = 1.0

# Multiplicador de experiência adquirida no avanço de Gathering / Coleta de recursos.
# Padrão: 1.0 (1x)
gameserver.rate.gather.xp = 1.0


################################################################################
##                                                                            ##
##  [6] GEOMETRIA, GEODATA E FÍSICA (GEOENGINE & MOVEMENT)                    ##
##                                                                            ##
################################################################################

# Habilita o motor de geometria 3D GeoEngine (carregamento de malhas e relevo).
# Se habilitado, calcula alturas de solo reais, checa linha de visão e bloqueia travessia de paredes.
# Padrão: true
gameserver.geodata.enable = true

# Diretório onde residem os arquivos binários .geo e meshs.geo extraídos do cliente oficial.
# Padrão: data/Geo
gameserver.geodata.path = data/Geo

# Habilita o bloqueio e colisão dinâmica de portas estáticas (doors/portões de castelo).
# Padrão: true
gameserver.geodata.doors.enable = true

# Habilita o mapeamento e efeito de zonas de materiais derivados da geometria dos mapas.
# Padrão: true
gameserver.geodata.materials.enable = true

# Habilita o cálculo de dano por queda em aterrissagens em alta velocidade de grandes altitudes.
# Padrão: true
gameserver.geodata.falldamage.enable = true

# Habilita a validação autoritativa de velocidade de movimento no servidor contra speed-hacks e no-clip.
# Padrão: true
gameserver.geodata.speedvalidation.enable = true


################################################################################
##                                                                            ##
##  [7] PROTEÇÃO CONTRA FLOOD E SEGURANÇA (SECURITY & FLOOD FILTER)          ##
##                                                                            ##
################################################################################

# Habilita o sistema de filtro anti-flood de pacotes de rede por conexão.
# Padrão: false
gameserver.flood.protection.enable = false

# Intervalo de amostragem em milissegundos para medição de frequência de pacotes.
# Padrão: 1000 (1 segundo)
gameserver.flood.tick.ms = 1000

# Limite de pacotes no intervalo curto para gerar alerta de log no servidor.
# Padrão: 10
gameserver.flood.short.warn = 10

# Limite de pacotes no intervalo curto para desconectar ou rejeitar o cliente por flood.
# Padrão: 20
gameserver.flood.short.reject = 20

# Limite de pacotes no intervalo longo para gerar alerta no servidor.
# Padrão: 30
gameserver.flood.long.warn = 30

# Limite de pacotes no intervalo longo para desconectar o cliente.
# Padrão: 60
gameserver.flood.long.reject = 60
