# DXVK Configuration for Aion Classic EU
# Place this file in the game root directory (Cliente\GFAion\aionclassic\dxvk.conf)

# Enable FPS counter (uncomment to show FPS hud)
dxvk.hud = fps

# Allow exclusive full-screen mode
dxvk.allowFse = True

# Performance Optimizations
d3d9.cachedDynamicBuffers = true
d3d9.deferSurfaceCreation = true

# Quality
d3d9.samplerAnisotropy = 16

# Compatibility and Shader Fixes
d3d9.forceSamplerTypeSpecConstants = true
