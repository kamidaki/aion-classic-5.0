#
# ----------------------------
# Geodata config's:
# ----------------------------

# Enable Geodata (heights and meshes)
# Default: true
gameserver.geodata.enable = true

# Enable canSee checks using geodata.
# Default: true
gameserver.geodata.cansee.enable = true

# Enable fear skill using geodata.
# Default: true
gameserver.geodata.fear.enable = true

# If enabled - during movements npcs will be checking z coordinate based on geo if target is flying
# Default: true
gameserver.geodata.npc.move = true

#Enable geo materials using skills
# Default: true
gameserver.geodata.materials.enable = true

# Show collision zone name and skill id for GMs
# Default: false
gameserver.geodata.materials.showdetails = false

# Enable geodata shields
# Default: true
gameserver.geodata.shields.enable = true

# ============================================
# ============================================

# Default: true


# Default: true

# =========================================================================
# ============================================
# Navigation System (NavMesh Pathfinding)
# ============================================
gameserver.geodata.nav.enable = true
gameserver.geodata.nav.dir = data/nav/
gameserver.geodata.forced_move.nav_fallback = true

# ============================================
# Grade oficial de navegacao (path.dat do cliente)
# ============================================
# Perseguicao e volta ao spawn de NPC pela grade do levels/X-path.dat (copia em data/native-path/).
# A navmesh acima fica como reserva onde a grade nao acha caminho.
gameserver.geodata.pathdat.enable = true
gameserver.geodata.pathdat.dir = data/native-path/
# true: quebra a reta onde a altura sai mais de 0,5 m do chao (o oficial manda uma reta so e o NPC atravessa rampa/escada)
# false: exatamente como o oficial
gameserver.geodata.pathdat.follow_floor = true
# Limite de nos do A* por busca
gameserver.geodata.pathdat.max_nodes = 100000
# Perseguicao: rota andando mais longa que isto (metros) = alvo inalcancavel, o NPC desiste
gameserver.geodata.pathdat.max_path_length = 100
# true: NPC pode cair de borda como o oficial; false: sempre anda (rampa/escada)
gameserver.geodata.pathdat.allow_drop = false

