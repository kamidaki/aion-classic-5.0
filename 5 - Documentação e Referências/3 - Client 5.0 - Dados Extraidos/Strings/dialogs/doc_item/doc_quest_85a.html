          <p>Nobre Pedra</p>
          <p> </p>

          <p> </p>
          <p>A alma lament&#225;vel vagueia pelo mundo em busca da &#193;rvore da Eternidade.</p>
          <p> </p>
          <p>Aquele que est&#225; destinado a escrever sua pr&#243;pria lenda obter&#225; a alma e cumprir&#225; a vontade da eternidade.</p>
