[package]
name = "auto-start"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "auto-start"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
parking_lot = "0.12"
warp = "0.3"
open = "5.1"
windows-sys = { version = "0.52", features = ["Win32_System_JobObjects", "Win32_Foundation"] }
