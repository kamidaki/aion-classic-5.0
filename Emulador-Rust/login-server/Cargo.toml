[package]
name = "login-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = { version = "0.31", features = ["serialize"] }
base64 = "0.22"
parking_lot = "0.12"
chrono = "0.4"
rand = "0.8"
commons = { path = "../commons" }
rsa = "0.9.10"
sha1 = "0.10"

[build-dependencies]
winres = "0.1"

