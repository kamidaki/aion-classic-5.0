# ============================================================================
# Aion Classic - Game Server Configuration
# ============================================================================

[network]
# Address where the Game server binds
bind_address = "0.0.0.0"
# Port for game connections (default: 7777)
port = 7777

[server]
# Server ID matching Auth Server list (23 = 0x17 = Atreia)
server_id = 23
server_name = "Atreia"
tick_rate = 144.0

[database]
# Path to SQLite database
database_path = "aion.db"

[world]
# Game client data directory containing extracted XMLs
data_dir = "data/client"
# Spawns CSV file path
spawns_file = "data/spawns.csv"
# Initial kit CSV file path
initial_kit_file = "data/itens_iniciais.csv"
# Player vision radius in meters (streaming limit)
vision_radius = 100.0

[security]
# Require a valid session token / key
require_valid_session = true
