# ============================================================================
# Aion Classic - Auth / Login Server Configuration
# ============================================================================

[network]
# Address where the Auth / Login server binds
bind_address = "0.0.0.0"
# Port for classic Aion client authentication (default: 2106)
client_port = 2106
# Port for Gameforge HQ authentication (default: 13001)
hq_port = 13001

[database]
# Path to SQLite database
database_path = "aion.db"

[accounts]
# Automatically create accounts when a player logs in
auto_create_accounts = true
# Enable development mode
development_mode = true
# Default dev username for auto-fill / default sessions
default_dev_username = "teste"

[game_servers]
# Default Game Server ID in server list (23 = 0x17 = Atreia)
default_server_id = 23
# Game Server announce IP
game_server_ip = "127.0.0.1"
# Game Server announce Port
game_server_port = 7777

[gameforge_pipe]
# Enable internal Gameforge Client JSON-RPC Named Pipe provider (eliminates launcher.exe)
enabled = true
pipe_name = "\\\\.\\pipe\\GameforgeClientJSONRPC"
