# ============================================================================
# Aion Classic - STS (Secure Token Service) Server Configuration
# ============================================================================

[network]
# Address where the STS server binds
bind_address = "0.0.0.0"
# Port for STS protocol (default: 6600)
port = 6600

[database]
# Path to SQLite database
database_path = "aion.db"

[authentication]
# Gameforge STS user center / market code
user_center = 22
user_status = 1
default_account_name = "teste"
