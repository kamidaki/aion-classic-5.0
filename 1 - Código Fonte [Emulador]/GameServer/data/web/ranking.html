<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aion Classic 5.0 - Classificação de Abyss e Legiões</title>
    <style>
        :root {
            --bg-base: #0c0a09;
            --bg-surface: rgba(28, 25, 23, 0.85);
            --gold: #fbbf24;
            --amber: #f59e0b;
            --text: #f5f5f4;
            --text-muted: #a8a29e;
            --border: rgba(245, 158, 11, 0.2);
            --elyos: #60a5fa;
            --asmodian: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: radial-gradient(circle at 50% 0%, #1c1917 0%, #0c0a09 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 28px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        .title { font-size: 22px; font-weight: 800; color: var(--gold); }
        .btn-back {
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }
        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        th {
            background: rgba(245, 158, 11, 0.08);
            color: var(--gold);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover { background: rgba(255,255,255,0.02); }
        .rank-badge {
            font-weight: 800;
            font-size: 16px;
            color: var(--gold);
            width: 36px;
            text-align: center;
        }
        .race-elyos { color: var(--elyos); font-weight: 600; }
        .race-asmodian { color: var(--asmodian); font-weight: 600; }
        .ap-val { color: var(--amber); font-weight: 700; font-family: monospace; font-size: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="title">🏆 CLASSIFICAÇÃO OFICIAL — ABYSS & GLÓRIA</div>
        <a href="/shop" class="btn-back">⬅️ Voltar à Loja</a>
    </header>

    <table>
        <thead>
            <tr>
                <th style="width: 60px;">Pos.</th>
                <th>Personagem</th>
                <th>Nível</th>
                <th>Classe</th>
                <th>Facção</th>
                <th>Pontos de Abyss (AP)</th>
            </tr>
        </thead>
        <tbody id="ranking-list">
            <!-- Linhas carregadas via API -->
        </tbody>
    </table>

    <script>
        fetch('/api/ranking/players')
            .then(r => r.json())
            .then(data => {
                const tbody = document.getElementById('ranking-list');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #78716c;">Nenhum jogador online no momento. O ranking e atualizado dinamicamente.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td class="rank-badge">${p.rank}</td>
                        <td><strong>${p.name}</strong></td>
                        <td>Nv. ${p.level}</td>
                        <td>${p.playerClass}</td>
                        <td class="${p.race === 'ELYOS' ? 'race-elyos' : 'race-asmodian'}">${p.race}</td>
                        <td class="ap-val">${Number(p.ap).toLocaleString()} AP</td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
