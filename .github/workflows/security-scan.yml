name: Analise de Seguranca e Deteccao de Segredos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Verificacao de Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com Historico Completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Varredura Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: "free"

  codeql:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 25 para CodeQL
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Compilar com Maven
        run: mvn clean compile --file "Código Fonte - Emulador/pom.xml" -DskipTests=true

      - name: Finalizar Analise CodeQL
        uses: github/codeql-action/analyze@v3
