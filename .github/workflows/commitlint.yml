name: Conventional Commits Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [ "main" ]

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-title-lint:
    name: Validar Titulo do PR / Commit
    runs-on: ubuntu-latest
    steps:
      - name: Bypass para o Proprietario do Repositorio
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner
        run: |
          echo "Bypass automático aplicado: autor do PR é o proprietário do repositório (${{ github.repository_owner }})."

      - name: Validar Titulo Semantico
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          scopes: |
            gameforge
            login-server
            chat-server
            commons
            version.dll
            l10n
            docs
            ci
            build
          requireScope: false
