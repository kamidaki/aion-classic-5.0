name: Conventional Commits Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [ "main" ]

permissions:
  pull-requests: read
  contents: read

jobs:
  pr-title-lint:
    name: Validar Titulo do PR / Commit
    runs-on: ubuntu-latest
    steps:
      - name: Validar Titulo Semantico
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          scopes: |
            gameforge
            remake
            battleroyale
            login-server
            chat-server
            commons
            version.dll
            rust
            launcher
            nolag
            docs
            ci
          requireScope: false
