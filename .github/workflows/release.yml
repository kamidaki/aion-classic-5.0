name: 📦 Public Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Configurar Java 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: 🦀 Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Compilar Backend Java 25
        run: |
          mvn clean package --file "Código Fonte - Emulador/pom.xml" -DskipTests=true

      - name: 🦀 Compilar Supervisor Rust (Release x64)
        run: |
          cd "Ferramentas e Documentos/Ferramentas Python e PowerShell/Código Fonte - Executável Rust do Emulador"
          cargo build --release

      - name: 🗜️ Empacotar Release Bundle
        shell: pwsh
        run: |
          $ReleaseDir = "release-bundle"
          New-Item -ItemType Directory -Path $ReleaseDir -Force
          
          # Copiar JARs
          Copy-Item "Código Fonte - Emulador/commons/target/*.jar" -Destination $ReleaseDir
          Copy-Item "Código Fonte - Emulador/login-server/target/*.jar" -Destination $ReleaseDir
          Copy-Item "Código Fonte - Emulador/game-server/target/*.jar" -Destination $ReleaseDir
          Copy-Item "Código Fonte - Emulador/chat-server/target/*.jar" -Destination $ReleaseDir
          
          # Copiar Executável Supervisor
          Copy-Item "Ferramentas e Documentos/Ferramentas Python e PowerShell/Código Fonte - Executável Rust do Emulador/target/release/*.exe" -Destination $ReleaseDir -ErrorAction SilentlyContinue
          
          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "aion-classic-5.0-release-${{ github.ref_name }}.zip"

      - name: 🚀 Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aion-classic-5.0-release-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
