name: Sugestao de Melhoria Tecnica
description: Proponha uma melhoria de protocolo, compatibilidade ou otimizacao para o Aion Classic 5.0.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propostas de novas funcionalidades devem manter a fidelidade 1:1 com o Aion Classic 5.0 oficial da Gameforge ou respeitar o isolamento da modalidade alvo.
  - type: dropdown
    id: component
    attributes:
      label: Componente ou GameServer Alvo
      description: Para qual componente isolado esta melhoria se destina?
      options:
        - "GameServer GameForge (GSID 1)"
        - "GameServer Remake (GSID 2)"
        - "GameServer BattleRoyale (GSID 3)"
        - "LoginServer (Java 25)"
        - "ChatServer (Java 25)"
        - "Supervisor Launcher (Rust)"
        - "Client Hook (version.dll)"
        - "Academy NoLag (.NET 9)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descricao da Melhoria
      description: Uma explicacao clara e objetiva do que deve ser implementado.
    validations:
      required: true
  - type: textarea
    id: official_evidence
    attributes:
      label: Evidencia Oficial ou Justificativa de Arquitetura
      description: Dados do cliente oficial (Ghidra/Wireshark/tabelas de extração) que respaldam a proposta.
    validations:
      required: true
