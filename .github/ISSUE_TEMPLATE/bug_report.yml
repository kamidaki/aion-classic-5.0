name: Relato de Bug Tecnico
description: Relate uma falha tecnica com evidencias comparativas do servidor oficial Aion Classic Gameforge.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por contribuir com a identificacao de falhas no **Aion Classic 5.0**.
        Todo relato deve obrigatoriamente referenciar o componente especifico e fornecer evidencias concretas extraidas do servidor oficial, Ghidra ou Wireshark.
  - type: dropdown
    id: component
    attributes:
      label: Componente ou GameServer Afetado
      description: Em qual componente isolado o erro ocorre?
      options:
        - "GameServer GameForge (GSID 1 | Porta 7777)"
        - "GameServer Remake (GSID 2 | Porta 7778)"
        - "GameServer BattleRoyale (GSID 3 | Porta 7779)"
        - "LoginServer (Java 25 | Porta 2106)"
        - "ChatServer (Java 25 | Porta 10241)"
        - "Supervisor Launcher e DB Studio (Rust)"
        - "Client Hook (version.dll C/C++)"
        - "Academy NoLag (.NET 9)"
        - "Parsers e Ferramentas (Python/PowerShell)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descricao do Bug
      description: Explicacao concisa e tecnica do comportamento anomalo observado.
    validations:
      required: true
  - type: textarea
    id: official_comparison
    attributes:
      label: Comparacao com o Servidor Oficial Aion Classic Gameforge
      description: Qual e o comportamento real no servidor oficial Gameforge? Inclua detalhes de pacotes, formulas ou dados oficiais observados.
    validations:
      required: true
  - type: textarea
    id: evidence_ghidra_wireshark
    attributes:
      label: Evidencias Tecnicas (Ghidra / Wireshark / Imagens)
      description: Anexe trechos de descompilacao do Ghidra (bin64), dados de pacotes do Wireshark (PCAP oficial) ou links para capturas de tela comprovando a divergencia.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para Reproduzir
      description: Etapas exatas para reproduzir o erro no ambiente do emulador.
      placeholder: |
        1. Iniciar os servidores no Supervisor Rust...
        2. Conectar com o cliente Aion Classic 5.0 no servidor selecionado...
        3. Executar a acao X...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que deveria acontecer segundo o funcionamento do cliente e servidor oficial.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stacktrace
      description: Cole aqui logs relevantes de console ou erros do servidor correspondente.
      render: shell
