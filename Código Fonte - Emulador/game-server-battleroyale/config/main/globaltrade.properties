#
# ----------------------------
# Global Auction House (Classic 5.0)
# ----------------------------
# Padroes medidos nas capturas oficiais de 2026-09-11. Anuncio em Quna (Luna) usa o saldo de Quna da conta.

# Liga ou desliga a Auction House
# Default: true
gameserver.globaltrade.enable = true

# Nivel minimo (STR_MSG_WORLD_VENDOR_BELOW_STANDARD)
# Default: 10
gameserver.globaltrade.min.level = 10

# Maximo de itens anunciados ao mesmo tempo (STR_MSG_WORLD_VENDOR_FULL_BASKET)
# Default: 15
gameserver.globaltrade.max.listings = 15

# Taxa de registro em 1/10000 do preco (captura: 2.420 para 200.000)
# Default: 121
gameserver.globaltrade.register.fee.permyriad = 121

# Taxa de registro de anuncio em Quna, em kinah por Quna do preco (captura: 6.050 para 10 Quna)
# Default: 605
gameserver.globaltrade.quna.register.fee = 605

# Taxa da venda em 1/10000 do preco (captura: 200.000 rendeu 184.000)
# Default: 800
gameserver.globaltrade.sale.fee.permyriad = 800

# Compra dividida de anuncios em kinah com mais de uma unidade (precisa do version.dll com globaltrade_fix)
# Preco = (total / quantidade, para baixo) x quantidade comprada
# Default: true
gameserver.globaltrade.split.buy = true

# Duracao do anuncio em dias (nao medido)
# Default: 8
gameserver.globaltrade.listing.days = 8

# Preco total maximo de um anuncio
# Default: 99999999999
gameserver.globaltrade.max.price = 99999999999

# Limite semanal de kinah mostrado pelo S_GLOBAL_TRADE_STATE
# Default: 1000000000
gameserver.globaltrade.weekly.kinah.limit = 1000000000
