# =================================================================
#               GEOGRAPHIC FIREWALL CONFIGURATION
# =================================================================

# Enable or disable the geographic firewall.
# false = all incoming connections are permitted (default / unrestricted).
# true  = only connections from allowed countries or manual whitelist are permitted.
geo.firewall.enable = true

# Path to the "GeoIP" directory.
# If left blank, the server will automatically search:
# 1) ../Config/GeoIP or ./Config/GeoIP (standard directory layout)
# 2) ../GeoIP or ./GeoIP
# 3) ../WORLD IP RANGE or ./WORLD IP RANGE (legacy layout)
# 4) Environment variable GEOIP_WORLD_RANGE_DIR or system property -Dgeoip.world.range.dir
geo.firewall.world_ip_range_dir = 

# Comma-separated list of country ISO 2-letter codes allowed to connect.
# Example for South America: br, ar, cl, uy, py, bo, co, ec, pe, ve, gy, sr, gf, fk
# Set to "all" to allow all countries.
geo.firewall.allowed_countries = br, ar, cl, uy, py, bo, co, ec, pe, ve, gy, sr, gf, fk

# Manual whitelist of specific IP addresses or CIDR ranges allowed to connect
# even if their country is blocked.
# Example: 189.10.20.30, 200.150.0.0/16
geo.firewall.manual_whitelist_ips = 
