#
# ----------------------------
# Geodata config's:
# ----------------------------

# Enable Geodata (heights and meshes)
# Default: true
gameserver.geodata.enable = true

# Enable canSee checks using geodata.
# Default: true
gameserver.geodata.cansee.enable = true

# Enable fear skill using geodata.
# Default: true
gameserver.geodata.fear.enable = true

# If enabled - during movements npcs will be checking z coordinate based on geo if target is flying
# Default: true
gameserver.geodata.npc.move = true

#Enable geo materials using skills
# Default: true
gameserver.geodata.materials.enable = true

# Show collision zone name and skill id for GMs
# Default: false
gameserver.geodata.materials.showdetails = false

# Enable geodata shields
# Default: true
gameserver.geodata.shields.enable = true

# ============================================
# Navigation System (NavMesh Pathfinding)
# ============================================

# Enable loading and use of Navigational data (NavMesh)
# Default: true
gameserver.geodata.nav.enable = false

# NavMesh data directory
# Default: data/nav/
gameserver.geodata.nav.dir = data/nav/

# Enable forced movement nav fallback
# Default: true
gameserver.geodata.forced_move.nav_fallback = false

# =========================================================================
# CRYENGINE NATIVE PATHFINDING SUBSYSTEM (NATIVE-PATH)
# =========================================================================
# Habilitar navegacao nativa CryEngine (*-path.dat)
# Padrao: true
gameserver.nativepath.enable = true

# Diretorio raiz contendo os mapas nativos {ID_MAP}_nome/xxxx.dat
gameserver.nativepath.dir = data/native-path/

# Numero maximo de mapas mantidos simultaneamente na memoria RAM (Cache LRU)
gameserver.nativepath.max_cached_maps = 50

# Timeout de inatividade para descarregar mapas da memoria (ms)
gameserver.nativepath.inactive_timeout_ms = 300000

# Intervalo de limpeza periodica de mapas inativos (ms)
gameserver.nativepath.cleanup_interval_ms = 180000

# Limite de nos explorados na busca A* nativa
gameserver.nativepath.max_search_nodes = 4000

# Ativa logs de depuracao detalhados do Native-Path
gameserver.nativepath.debug = false